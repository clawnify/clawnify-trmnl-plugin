name: Check plugin
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm test
      - run: bin/trmnlp lint
      - run: bin/trmnlp test --report _build/report
      - run: npm run package
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: trmnl-plugin-and-report
          path: _build/
